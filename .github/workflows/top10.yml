name: Top 10 Netflix

# Classement Netflix France de la semaine, publié en top10.json à côté de l'APK (l'appli le lit).
on:
  schedule:
    - cron: "17 */6 * * *"
  push:
    paths:
      - scripts/top10.py
      - .github/workflows/top10.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  top10:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Récupérer le Top 10 et les titres français
        run: python3 scripts/top10.py top10.json
      - name: Publier top10.json
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload latest top10.json --clobber --repo "$GITHUB_REPOSITORY"
