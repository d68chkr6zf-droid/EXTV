name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Compiler l'APK de debug
        run: ./gradlew assembleDebug --stacktrace
      - name: Renommer l'APK
        run: |
          mkdir dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/EXTV.apk
      - uses: actions/upload-artifact@v4
        with:
          name: extv-debug
          path: dist/*.apk
      - name: Retirer les anciens fichiers de la page de téléchargement
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null \
            | grep -vx 'EXTV.apk' \
            | xargs -r -I{} gh release delete-asset latest {} --repo "$GITHUB_REPOSITORY" -y || true
      - name: Publier la dernière version (lien de téléchargement direct)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: EXTV (dernière version)
          prerelease: true
          make_latest: true
          files: dist/*.apk
